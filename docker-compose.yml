services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: vehicle_market_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vehicle_valuation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vehicle_market_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/vehicle_valuation_db
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

  # Streamlit Interactive Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: vehicle_market_dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/vehicle_valuation_db
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
